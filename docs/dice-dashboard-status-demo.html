<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Dashboard Status Demo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f8fafc; color: #0f172a; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    .card { overflow: hidden; border: 1px solid #bae6fd; border-radius: 22px; background: white; box-shadow: 0 14px 35px rgba(15, 23, 42, .08); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #e0f2fe; background: #f0f9ff; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 850; }
    .radar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 11px; background: #dbeafe; color: #0369a1; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 7px 10px; color: #047857; background: #d1fae5; font-size: 12px; font-weight: 850; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 4px #a7f3d0; }
    .body { padding: 23px 20px 18px; }
    .hero { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 14px; }
    .ring { display: grid; place-items: center; width: 58px; height: 58px; border: 4px solid #38bdf8; border-radius: 50%; color: #0369a1; background: #e0f2fe; font-size: 24px; font-weight: 900; box-shadow: 0 0 0 7px #f0f9ff; animation: pulse 1.8s ease-in-out infinite; }
    .hero h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    .sub { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: #64748b; font-size: 13px; }
    .chip { border-radius: 999px; padding: 3px 7px; color: #075985; background: #e0f2fe; font-size: 10px; font-weight: 850; }
    .timer { color: #0369a1; font-variant-numeric: tabular-nums; font-size: clamp(27px, 6vw, 42px); font-weight: 900; letter-spacing: .04em; }
    .next { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 11px; margin-top: 22px; padding: 14px 16px; border-radius: 15px; background: #f8fdff; }
    .next strong { font-size: 17px; }
    .next .chip { justify-self: start; }
    .loop { color: #10b981; font-size: 22px; font-weight: 900; }
    .label { color: #64748b; font-size: 12px; font-weight: 750; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 25px; }
    .step { position: relative; display: flex; align-items: center; gap: 8px; min-height: 24px; color: #64748b; font-size: 12px; font-weight: 800; }
    .step:not(:last-child)::after { content: ""; position: absolute; top: 11px; left: 20px; width: calc(100% - 28px); height: 2px; background: #bae6fd; }
    .step i { position: relative; z-index: 1; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #0ea5e9; color: white; font-size: 11px; font-style: normal; }
    .step.done i { background: #10b981; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
    .stat { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 8px; border-radius: 13px; background: #f8fafc; }
    .stat b { font-size: 21px; }
    .stat span { color: #64748b; font-size: 12px; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
    .auto { display: inline-flex; align-items: center; gap: 7px; color: #047857; font-size: 12px; font-weight: 850; }
    .details { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #cbd5e1; border-radius: 9px; color: #334155; font-weight: 850; }
    .demo-controls { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
    .button { border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 10px; background: white; color: #475569; font-size: 12px; font-weight: 800; cursor: pointer; }
    .button.active { border-color: #0284c7; background: #e0f2fe; color: #075985; }
    .caption { margin: 12px 0 0; color: #94a3b8; font-size: 11px; text-align: center; }
    .card[data-tone="attention"] { border-color: #fecaca; }
    .card[data-tone="attention"] .top { border-color: #fee2e2; background: #fff7f7; }
    .card[data-tone="attention"] .ring { border-color: #f87171; color: #b91c1c; background: #fee2e2; box-shadow: 0 0 0 7px #fff1f2; }
    .card[data-tone="attention"] .pill { color: #b91c1c; background: #fee2e2; }
    .card[data-tone="attention"] .dot { background: #ef4444; box-shadow: 0 0 0 4px #fecaca; }
    .step.active { color: #0369a1; }
    .step.active i { background: #0369a1; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, .22); } 50% { box-shadow: 0 0 0 7px rgba(14, 165, 233, 0); } }
    @media (max-width: 560px) {
      main { margin: 24px auto; }
      .top { padding: 14px 16px; }
      .body { padding: 20px 16px 16px; }
      .hero { grid-template-columns: 50px 1fr; }
      .ring { width: 50px; height: 50px; font-size: 20px; }
      .timer { grid-column: 2; font-size: 30px; }
      .next { grid-template-columns: auto 1fr auto; }
      .next strong { justify-self: start; }
      .next .chip { grid-column: 2; }
      .steps { gap: 7px; }
      .step { font-size: 10px; }
      .step:not(:last-child)::after { width: calc(100% - 16px); }
      .stats { gap: 6px; }
      .stat { gap: 4px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" data-tone="waiting" aria-label="Dice 自动投递状态">
      <header class="top"><div class="brand"><span class="radar" aria-hidden="true">◉</span><span>Dice</span></div><span class="pill"><span class="dot"></span><span id="mode">即将开始</span></span></header>
      <div class="body">
        <div class="hero"><div class="ring" id="stateIcon" aria-hidden="true">↻</div><div><h1 id="headline">下一轮即将开始</h1><div class="sub"><span id="subline">倒计时结束后自动开始</span><span class="chip">JAVA</span></div></div><div class="timer" id="timer" aria-live="polite">00:42:18</div></div>
        <div class="next"><span class="label">自动开始</span><strong id="nextRun">1:42 PM</strong><span class="chip" id="batch">JAVA</span><span class="loop" aria-label="自动循环">↻</span></div>
        <div class="steps" aria-label="自动循环"><div class="step done"><i>✓</i><span>已完成</span></div><div class="step active"><i>•••</i><span>倒计时</span></div><div class="step"><i>3</i><span>立即开始</span></div></div>
        <div class="stats"><div class="stat"><b>✓ 73</b><span>提交</span></div><div class="stat"><b>↷ 6</b><span>跳过</span></div><div class="stat"><b>! 0</b><span>处理</span></div></div>
        <div class="footer"><span class="auto"><span class="dot"></span>自动继续</span><span class="details" title="查看详情">↗</span></div>
      </div>
    </section>
    <div class="demo-controls" aria-label="切换演示状态"><button class="button active" data-state="waiting" type="button">✓ 等待</button><button class="button" data-state="running" type="button">Ⅱ 运行</button><button class="button" data-state="attention" type="button">! 处理</button></div>
    <p class="caption">点击图标切换状态</p>
  </main>
  <script>
    const states = {
      waiting: { headline: "下一轮即将开始", subline: "倒计时结束后自动开始", mode: "即将开始", nextRun: "1:42 PM", batch: "JAVA", icon: "↻", tone: "waiting" },
      running: { headline: "运行中", subline: "Java · 18", mode: "运行", nextRun: "现在", batch: "JAVA", icon: "Ⅱ", tone: "running" },
      attention: { headline: "需要处理", subline: "登录 / 人机验证", mode: "暂停", nextRun: "处理后恢复", batch: "DICE", icon: "!", tone: "attention" }
    };
    let seconds = 42 * 60 + 18;
    const timer = document.getElementById("timer");
    const renderTimer = () => { const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); const s = seconds % 60; timer.textContent = [h, m, s].map((v) => String(v).padStart(2, "0")).join(":"); if (seconds > 0) seconds -= 1; };
    renderTimer(); setInterval(renderTimer, 1000);
    document.querySelectorAll("[data-state]").forEach((button) => button.addEventListener("click", () => {
      document.querySelectorAll("[data-state]").forEach((item) => item.classList.toggle("active", item === button));
      const state = states[button.dataset.state];
      document.querySelector(".card").dataset.tone = state.tone;
      document.getElementById("headline").textContent = state.headline;
      document.getElementById("subline").textContent = state.subline;
      document.getElementById("mode").textContent = state.mode;
      document.getElementById("nextRun").textContent = state.nextRun;
      document.getElementById("batch").textContent = state.batch;
      document.getElementById("stateIcon").textContent = state.icon;
      if (state.tone === "attention") timer.textContent = "—";
      else renderTimer();
    }));
  </script>
</body>
</html>
