# The whole app is this one group: the app and its one database container. The name is fixed, so building
# from the deploy worktree replaces these same containers instead of starting a second set.
name: contractjobagent

services:
  contract-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract-job-agent

    ports:
      - "3008:3008"

    # The same private settings the app uses on the Mac; they are read at run time, never baked into the image.
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false

    environment:
      # Uploaded resumes are stored under this path, so it has to be the Mac's path, not the container's home.
      RESUME_STORAGE_PATH: ${RESUME_STORAGE_PATH:-${HOME}/.contractor-agent/resumes}

    # Resumes and the outreach context are stored in the database as absolute Mac paths, so they are
    # mounted at those same paths. DOCKER_EXTRA_RESUME_DIR covers resumes registered from another folder.
    volumes:
      - ${RESUME_STORAGE_PATH:-${HOME}/.contractor-agent/resumes}:${RESUME_STORAGE_PATH:-${HOME}/.contractor-agent/resumes}
      - ${DOCKER_EXTRA_RESUME_DIR:-${HOME}/.contractor-agent/resumes}:${DOCKER_EXTRA_RESUME_DIR:-${HOME}/.contractor-agent/resumes}:ro
      - ${OUTREACH_CONTEXT_PATH}:${OUTREACH_CONTEXT_PATH}:ro

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  # The one database container. It holds contractor_agent (production) and contractor_agent_dev (one
  # schema per coding-agent worktree, CLAUDE.md §17). Published on the Mac's loopback so scripts reach it.
  db:
    image: postgres:18
    container_name: contractor-agent-db
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  # The existing data volume, created before compose managed this container. External, so compose never
  # creates or deletes it: not even `docker compose down -v` can remove the data.
  pgdata:
    external: true
    name: contractor_agent_pgdata
